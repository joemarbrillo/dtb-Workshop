version: 2

sources:
  - name: raw
    description: Raw ShopFlow tables, loaded as-is by load_raw.py
    schema: raw
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: customers
      - name: products
      - name: orders
      - name: order_items
      - name: payments
      