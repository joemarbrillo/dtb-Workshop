name: shopflow
version: "1.0.0"
profile: shopflow

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

models:
  shopflow:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
      +tags: ["daily"]
      
seeds:
  shopflow:
    +schema: ref

on-run-end:
  - "create table if not exists main.dbt_run_log (invocation_id varchar, run_at timestamp, target varchar, nodes integer)"
  - "insert into main.dbt_run_log values ('{{ invocation_id }}', current_timestamp, '{{ target.name }}', {{ results | length}})"
  